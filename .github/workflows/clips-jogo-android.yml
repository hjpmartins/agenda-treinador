name: Clips de Jogo — APK Android

on:
  push:
    paths:
      - "clips-jogo/**"
      - ".github/workflows/clips-jogo-android.yml"
  workflow_dispatch:

concurrency:
  group: clips-jogo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60
    defaults:
      run:
        working-directory: clips-jogo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clips-jogo/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos e testes JS
        run: |
          npm run typecheck
          npm test

      - name: Gerar projeto Android
        run: npx expo prebuild --platform android --no-install
        env:
          CI: "1"

      - name: Testes do motor nativo
        working-directory: clips-jogo/android
        run: ./gradlew :clip-engine:testDebugUnitTest --no-daemon

      - name: Compilar APK
        working-directory: clips-jogo/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Dar nome ao APK com a versão
        id: apk
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          cp android/app/build/outputs/apk/release/app-release.apk "clips-jogo-$VERSION.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: clips-jogo-${{ steps.apk.outputs.version }}
          path: clips-jogo/clips-jogo-${{ steps.apk.outputs.version }}.apk
          retention-days: 30

      # A app procura as Releases "clips-jogo-v<versão>" e atualiza-se sozinha.
      - name: Publicar versão para atualização na app
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.apk.outputs.version }}
        run: |
          TAG="clips-jogo-v$VERSION"
          APK="clips-jogo-$VERSION.apk"
          git log -1 --format=%B "$GITHUB_SHA" | grep -v -E '^(Co-Authored-By|Claude-Session):' > notas.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --notes-file notas.txt
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "Clips de Jogo $VERSION" --notes-file notas.txt
          fi
