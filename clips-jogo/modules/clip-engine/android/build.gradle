plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'pt.clipsjogo'
version = '0.1.0'

android {
  namespace "pt.clipsjogo.engine"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  testOptions {
    unitTests.returnDefaultValues = true
  }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
}
